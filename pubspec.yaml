name: vendorapp
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  go_router: ^14.2.3
  dio: ^5.7.0
  image_picker: ^1.1.2
  image_picker_for_web: ^3.0.5
  fl_chart: ^0.65.0
  intl: ^0.18.0
  shared_preferences: ^2.2.2
  http: ^1.1.0
  url_launcher: ^6.3.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  cupertino_icons: ^1.0.8
  sentry_flutter: ^8.14.2
  app_settings: ^5.1.1
  audioplayers: ^6.1.0

# package_info_plus (pulled in by sentry_flutter) newer than this needs a newer
# Kotlin toolchain than the Android build uses; 8.0.2 compiles with it.
dependency_overrides:
  package_info_plus: 8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/