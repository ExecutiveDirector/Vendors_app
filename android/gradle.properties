# Heap sized to fit a GitHub Actions runner (~7GB); 8G could get the build killed.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC
android.useAndroidX=true
# Jetifier only matters for legacy android.support libraries; every plugin here
# (firebase, sentry, image_picker, ...) is AndroidX-native. Same setting as the rider app.
android.enableJetifier=false
