name: Lint fix (temporary)

on:
  push:
    branches: [ui/lint-cleanup]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Analyze before
        run: flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/before.txt 2>&1 || true
      - name: Apply automatic fixes
        run: dart fix --apply
      - name: Analyze after
        run: flutter analyze --no-fatal-infos --no-fatal-warnings > analyze-after.txt 2>&1 || true
      - name: Commit results
        run: |
          tail -3 /tmp/before.txt > analyze-summary.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: dart fix --apply and analyzer report" || echo "nothing to commit"
          git push
